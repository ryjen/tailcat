name: Nix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR builds waste runner time; never cancel main-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nix-quick-install-action installs a daemonless Nix whose
      # store cache-nix-action can save and restore.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      # A primary cache key must change when Go source or build inputs
      # change. Otherwise the restored primary-key cache is immutable and
      # this action won't save the newly built output (confirmed in CI).
      # Restore an earlier snapshot to reuse the Go 1.27.2 toolchain and
      # vendored dependencies; source changes still receive a new cache.
      # Each new snapshot consumes cache storage, so keep the 4G GC bound
      # and rely on GitHub's LRU cache retention rather than saving every
      # job run under a unique key.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'flakehashes.json', 'go.mod', 'go.sum', 'build-tags.txt', '**/*.go') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      # This catches flake breakage that only Nix users would
      # otherwise see, such as go.mod requiring a newer Go than the
      # pinned nixpkgs ships.
      - run: nix build --print-build-logs
